<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; --accent: #3b82f6; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px/1.5 system-ui, sans-serif; }
  form { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
  #repo { flex: 1; padding: 6px 10px; font: inherit; }
  button { padding: 6px 16px; font: inherit; cursor: pointer; }
  #status { padding: 6px 12px; color: var(--muted); border-bottom: 1px solid var(--line); white-space: pre-wrap; }
  #status.error { color: #dc2626; }
  main { flex: 1; display: flex; min-height: 0; }
  #list { width: 320px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  #filter { margin: 8px 12px; padding: 4px 8px; font: inherit; }
  #skills { flex: 1; margin: 0; padding: 0; list-style: none; overflow: auto; border-top: 1px solid var(--line); }
  #skills li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #skills li:hover { background: #8881; }
  #skills li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  #skills .name { font-weight: 600; }
  #skills .repository { font-size: 12px; }
  #skills .description { color: var(--muted); font-size: 12px; }
  #skill { flex: 1; overflow: auto; padding: 12px 16px; }
  #skill a { font-size: 12px; color: var(--accent); word-break: break-all; }
  #skill .copies { font-size: 12px; color: var(--muted); }
  #skill pre { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
<form id="scan">
  <input id="repo" name="repo" placeholder="https://github.com/owner/repo, https://github.com/organization or a directory" autofocus required>
  <button type="submit">Scan</button>
</form>
<div id="status">Enter a repository and press Scan.</div>
<main>
  <div id="list">
    <input id="filter" type="search" placeholder="Filter by name or description" aria-label="Filter skills">
    <ul id="skills" role="listbox" aria-label="Skills"></ul>
  </div>
  <section id="skill" aria-live="polite"></section>
</main>
<script type="module">
  import { start } from './page.js';
  start(document, (repo) => fetch(`/api/scan?repo=${encodeURIComponent(repo)}`));
</script>
</body>
</html>
