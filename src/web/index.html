<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; --accent: #3b82f6; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px/1.5 system-ui, sans-serif; }
  form { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
  #repo { flex: 1; padding: 6px 10px; font: inherit; }
  button { padding: 6px 16px; font: inherit; cursor: pointer; }
  #status { padding: 6px 12px; color: var(--muted); border-bottom: 1px solid var(--line); white-space: pre-wrap; }
  #status.error { color: #dc2626; }
  main { flex: 1; display: flex; min-height: 0; }
  #skills { width: 320px; margin: 0; padding: 0; list-style: none; overflow: auto; border-right: 1px solid var(--line); }
  #skills li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #skills li:hover { background: #8881; }
  #skills li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  #skills .name { font-weight: 600; }
  #skills .description { color: var(--muted); font-size: 12px; }
  #skill { flex: 1; overflow: auto; padding: 12px 16px; }
  #skill a { font-size: 12px; color: var(--accent); word-break: break-all; }
  #skill .copies { font-size: 12px; color: var(--muted); }
  #skill pre { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
<form id="scan">
  <input id="repo" name="repo" placeholder="https://github.com/owner/repo or a directory" autofocus required>
  <button type="submit">Scan</button>
</form>
<div id="status">Enter a repository and press Scan.</div>
<main>
  <ul id="skills" role="listbox" aria-label="Skills"></ul>
  <section id="skill" aria-live="polite"></section>
</main>
<script>
  const form = document.getElementById('scan');
  const input = document.getElementById('repo');
  const button = form.querySelector('button');
  const status = document.getElementById('status');
  const list = document.getElementById('skills');
  const view = document.getElementById('skill');

  function setStatus(text, error = false) {
    status.textContent = text;
    status.classList.toggle('error', error);
  }

  function show(skill, item) {
    for (const other of list.children) other.setAttribute('aria-selected', String(other === item));
    const link = document.createElement('a');
    link.href = link.textContent = skill.link;
    link.target = '_blank';
    const text = document.createElement('pre');
    text.textContent = skill.text;
    view.replaceChildren(link);
    if (skill.copies.length > 0) {
      const copies = document.createElement('div');
      copies.className = 'copies';
      copies.textContent = `also in ${skill.copies.join(', ')}`;
      view.append(copies);
    }
    view.append(text);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    list.replaceChildren();
    view.replaceChildren();
    button.disabled = true;
    setStatus('Scanning…');
    try {
      const response = await fetch(`/api/scan?repo=${encodeURIComponent(input.value)}`);
      const result = await response.json();
      if (!response.ok) return setStatus(result.error, true);
      const { repository, skills, warnings } = result;
      const lines = [`${repository.id} · ${skills.length} ${skills.length === 1 ? 'skill' : 'skills'}`];
      setStatus([...lines, ...warnings.map((warning) => `warning: ${warning}`)].join('\n'));
      for (const skill of skills) {
        const item = document.createElement('li');
        item.setAttribute('role', 'option');
        item.title = skill.path;
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = skill.name;
        const description = document.createElement('div');
        description.className = 'description';
        description.textContent = skill.description;
        item.append(name, description);
        item.addEventListener('click', () => show(skill, item));
        list.append(item);
      }
    } catch (error) {
      setStatus(`Cannot reach the Skill Atlas server: ${error.message}`, true);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
